name: Update countries data

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and transform countries
        run: node scripts/fetch-countries.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- app/assets/data/countries.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/data/countries.json
          git commit -m "chore: update countries data [skip ci]"
          git push
